<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Boarding Passes | LuxeTravel</title>
    <meta name="description" content="View and manage your saved LuxeTravel journeys. Each trip is displayed as a stylized boarding pass showing your destination, full itinerary, total cost and duration.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header" role="banner">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="LuxeTravel — go to homepage">Luxe<span>Travel</span></a>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="planner.html">Plan Trip</a></li>
                    <li><a href="my-routes.html" class="active" aria-current="page">My Boarding Passes</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top:50px; margin-bottom:80px;">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:40px; flex-wrap:wrap; gap:16px;">
            <h1>Your Saved Journeys</h1>
            <button
                id="clear-history-btn"
                style="color:#c0392b; background:none; border:none; cursor:pointer; font-weight:700; font-size:0.88rem; letter-spacing:0.5px;"
                aria-label="Clear all saved journeys">
                CLEAR HISTORY
            </button>
        </div>

        <div id="saved-trips-container" aria-live="polite" aria-label="Saved trips list">
            <p style="text-align:center; margin-top:50px; color:var(--text-light);">Loading your trips…</p>
        </div>

    </main>

    <script src="src/js/my-routes.js"></script>
</body>
</html>
