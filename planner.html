<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Your Journey | LuxeTravel</title>
    <meta name="description" content="Build your perfect travel itinerary with LuxeTravel. Choose a destination, drag and drop experiences, track your budget in real-time, and save your trip as a boarding pass.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="main-header" role="banner">
        <div class="container navbar">
            <a href="index.html" class="logo" aria-label="LuxeTravel — go to homepage">Luxe<span>Travel</span></a>
            <nav aria-label="Main navigation">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="planner.html" class="active" aria-current="page">Plan Trip</a></li>
                    <li><a href="my-routes.html">My Boarding Passes</a></li>
                    <li><a href="about.html">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <!-- COUNTRY SELECTION -->
        <div id="country-selection-screen" class="container">
            <h1>Where would you like to go?</h1>
            <p>Choose your destination to begin crafting your itinerary.</p>
            <div class="country-grid" id="country-grid-select" role="list" aria-label="Available destinations"></div>
        </div>

        <!-- PLANNER INTERFACE -->
        <div id="planner-interface" class="hidden">

            <section class="dashboard-bar" aria-label="Trip summary dashboard">
                <div class="container" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <div>
                        <i class="fas fa-map-marker-alt" aria-hidden="true"></i>
                        Planning for: <strong id="selected-country-title" style="color:white; font-size:1.1rem;"></strong>
                    </div>
                    <div>
                        <span style="margin-right:20px;">
                            <i class="fas fa-coins" aria-hidden="true"></i>
                            Total: <span id="total-cost" class="stat-value" aria-live="polite">$0</span>
                        </span>
                        <span>
                            <i class="fas fa-clock" aria-hidden="true"></i>
                            Time: <span id="total-time" class="stat-value" aria-live="polite">0h</span>
                        </span>
                    </div>
                    <div style="display:flex; gap:10px; flex-wrap:wrap;">
                        <button class="btn-luxury" style="padding:6px 18px; font-size:0.8rem;" onclick="location.reload()" aria-label="Change destination country">
                            Change Country
                        </button>
                        <button id="save-btn" class="btn-luxury" style="background:white; color:#1a1a1a; padding:6px 18px; font-size:0.8rem;" aria-label="Save current trip">
                            Save Trip
                        </button>
                    </div>
                </div>
            </section>

            <div class="container planner-layout">

                <section class="catalog-section" aria-labelledby="catalog-heading">
                    <div class="section-header">
                        <h2 id="catalog-heading">Exclusive Experiences</h2>
                        <p style="color: var(--text-light); margin-bottom:20px;">Drag items to your itinerary on the right.</p>
                    </div>
                    <div id="catalog-grid" class="catalog-grid" role="list" aria-label="Available attractions to add"></div>
                </section>

                <aside class="itinerary-column" aria-label="Your trip itinerary">
                    <div class="itinerary-section">
                        <h3 style="margin-bottom:20px; text-align:center; border-bottom:1px solid #eee; padding-bottom:10px;">
                            Your Itinerary
                        </h3>
                        <div id="drop-zone-msg" class="empty-state" aria-hidden="true">
                            <i class="fas fa-suitcase-rolling" style="font-size:3rem; margin-bottom:10px; color:var(--primary-color);"></i>
                            <p>Drag experiences here</p>
                        </div>
                        <ul id="itinerary-list" class="itinerary-list" aria-label="Added itinerary items" aria-live="polite"></ul>
                    </div>
                </aside>

            </div>
        </div>

    </main>

    <script src="src/js/data.js"></script>
    <script src="src/js/app.js"></script>
</body>
</html>
